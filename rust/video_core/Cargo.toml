[package]
name = "video_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "video_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.maturin]
module-name = "video_core"
python-source = "../../src/rust_bindings"
